buildscript {
    repositories {
        google() // Fabric está ahora en Google Maven
        mavenCentral()
    }

    dependencies {
        // Actualizar a Firebase Crashlytics, ya que Fabric está obsoleto
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics' // Aplicar el plugin de Firebase Crashlytics

repositories {
    google()
    mavenCentral() // Asegurarse de que mavenCentral esté aquí también
}

android {
    compileSdkVersion 34 // Actualizado a la última API estable
    buildToolsVersion '34.0.0' // Actualizado a la última versión estable
    defaultConfig {
        applicationId "krausoft.volcanesdecostarica"
        minSdkVersion 21 // Se recomienda aumentar minSdkVersion para compatibilidad con bibliotecas modernas
        targetSdkVersion 34 // Actualizado a la última API estable
        versionCode 17
        versionName "2.12"
    }

    // Keep the following configuration in order to target Java 8.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace "krausoft.volcanesdecostarica" // Necesario para AGP 8.0+
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Migrar a AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'de.hdodenhof:circleimageview:3.1.0' // Actualizar a la última versión
    // implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5' // Eliminada, se reemplaza por Glide
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
    // implementation 'com.oguzdev:CircularFloatingActionMenu:1.0.2' // Eliminada por no usarse y estar obsoleta
    implementation 'com.google.android.material:material:1.12.0' // Reemplazo de com.android.support:design
    // Twitter SDK obsoleto eliminado, se reemplazará con Twitter4J
    implementation 'org.twitter4j:twitter4j-core:4.1.2'
    // Añadir Firebase BOM y Crashlytics SDK
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics'
}
